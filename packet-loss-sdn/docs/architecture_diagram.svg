<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Packet Loss Detection &amp; Recovery — UDP over SDN</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#666">Ryu controller reroutes UDP traffic from a lossy primary path to a clean backup path in Mininet</text>

  <!-- Controller box -->
  <rect x="330" y="80" width="240" height="66" rx="8" fill="#eef4fb" stroke="#2980b9" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" font-size="15" font-weight="700" fill="#2980b9">Ryu SDN Controller</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#555">installs flows · REST /sdn/reroute</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#555">OpenFlow 1.3 · TCP 6653 · REST 8080</text>

  <!-- OpenFlow control links (dashed) to switches -->
  <g stroke="#2980b9" stroke-width="1.5" stroke-dasharray="5,4" fill="none" opacity="0.7">
    <path d="M400,146 C330,200 300,220 250,250"/>
    <path d="M430,146 C430,200 450,220 450,250"/>
    <path d="M500,146 C560,200 600,220 650,250"/>
  </g>
  <text x="300" y="195" font-size="10" fill="#2980b9" opacity="0.8">OpenFlow (install/modify flows)</text>

  <!-- Hosts and switches -->
  <!-- h1 -->
  <rect x="40" y="300" width="90" height="56" rx="8" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="85" y="324" text-anchor="middle" font-size="14" font-weight="700">h1</text>
  <text x="85" y="342" text-anchor="middle" font-size="10" fill="#555">10.0.0.1 · sender</text>

  <!-- s1 -->
  <circle cx="250" cy="328" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="250" y="333" text-anchor="middle" font-size="14" font-weight="700">s1</text>

  <!-- s2 (primary, lossy) -->
  <circle cx="450" cy="230" r="30" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="450" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#c0392b">s2</text>

  <!-- s3 (backup, clean) -->
  <circle cx="450" cy="430" r="30" fill="#eafaf1" stroke="#27ae60" stroke-width="2.5"/>
  <text x="450" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#27ae60">s3</text>

  <!-- s4 -->
  <circle cx="650" cy="328" r="30" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="650" y="333" text-anchor="middle" font-size="14" font-weight="700">s4</text>

  <!-- h2 -->
  <rect x="770" y="300" width="90" height="56" rx="8" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="815" y="324" text-anchor="middle" font-size="14" font-weight="700">h2</text>
  <text x="815" y="342" text-anchor="middle" font-size="10" fill="#555">10.0.0.2 · receiver</text>

  <!-- Data links -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="130" y1="328" x2="220" y2="328"/>
    <line x1="650" y1="328" x2="770" y2="328"/>
  </g>
  <!-- primary path (red) -->
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <line x1="276" y1="312" x2="424" y2="246"/>
    <line x1="476" y1="246" x2="624" y2="312"/>
  </g>
  <text x="360" y="268" font-size="11" font-weight="700" fill="#c0392b" transform="rotate(-18 360 268)">PRIMARY · 30% loss</text>

  <!-- backup path (green) -->
  <g stroke="#27ae60" stroke-width="3" fill="none">
    <line x1="276" y1="344" x2="424" y2="414"/>
    <line x1="476" y1="414" x2="624" y2="344"/>
  </g>
  <text x="360" y="400" font-size="11" font-weight="700" fill="#27ae60" transform="rotate(18 360 400)">BACKUP · clean</text>

  <!-- UDP data flow arrow -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>
  <text x="85" y="378" text-anchor="middle" font-size="10" fill="#333">UDP seq# →</text>
  <text x="815" y="378" text-anchor="middle" font-size="10" fill="#333">← ACK</text>

  <!-- Recovery loop callout -->
  <rect x="150" y="470" width="600" height="72" rx="8" fill="#fffbea" stroke="#e0b000" stroke-width="1.5"/>
  <text x="165" y="492" font-size="12" font-weight="700" fill="#8a6d00">Recovery loop:</text>
  <text x="165" y="512" font-size="11.5" fill="#5a4a00">1. receiver sees sequence gaps &gt; threshold  →  2. writes /tmp/reroute.signal</text>
  <text x="165" y="530" font-size="11.5" fill="#5a4a00">3. reroute_agent (root ns) POSTs /sdn/reroute  →  4. controller moves flows s1/s4 to BACKUP  →  loss → 0</text>
</svg>
